spring:
  application:
    name: fightossstreak
  profiles:
    default: dev
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration

fos:
  # Versão do texto de disclaimer atualmente vigente. Subir quando o texto mudar
  # materialmente — isso força novo aceite (docs/06-disclaimer-responsabilidade.md).
  disclaimer-version: "2026-08-16"
  curriculum:
    index: "classpath:curriculum/modules.json"
    # Reingerir o currículo na subida. Como a árvore é dado versionado (D11), a fonte
    # de verdade é o JSON — o banco é só projeção dele.
    sync-on-startup: true

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html

server:
  # PORT em vez de SERVER_PORT porque é o nome que a Railway injeta em runtime (ela ignora
  # o EXPOSE do Dockerfile). O default 8080 mantém `./mvnw spring-boot:run` como era.
  port: ${PORT:8080}
  # `::` na Railway: a rede privada resolve IPv6 e ambientes anteriores a 16/10/2025 são
  # IPv6-only — com 0.0.0.0 o backend fica invisível para o nginx lá. Local segue 0.0.0.0.
  address: ${SERVER_ADDRESS:0.0.0.0}

management:
  endpoints:
    web:
      exposure:
        # Só o health. É o que a Railway consulta em deploy.healthcheckPath e o que o
        # healthcheck do Compose usa; o resto do actuator não precisa estar no ar.
        include: health

---
spring:
  config:
    activate:
      on-profile: dev
  datasource:
    # H2 em modo PostgreSQL: dev sem exigir Docker. Para rodar contra Postgres de verdade,
    # `docker compose up -d db` e use o perfil `postgres`.
    url: jdbc:h2:mem:fos;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH
    driver-class-name: org.h2.Driver
    username: sa
    password: ""

---
spring:
  config:
    activate:
      on-profile: postgres
  datasource:
    url: ${FOS_DB_URL:jdbc:postgresql://localhost:5432/fos}
    username: ${FOS_DB_USER:fos}
    password: ${FOS_DB_PASSWORD:fos}
