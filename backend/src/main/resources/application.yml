spring:
  application:
    name: fightossstreak
  profiles:
    default: dev
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration

fos:
  # Versão do texto de disclaimer atualmente vigente. Subir quando o texto mudar
  # materialmente — isso força novo aceite (docs/06-disclaimer-responsabilidade.md).
  disclaimer-version: '2026-08-16'
  auth:
    # As contas de administração (D48): fila de feedback e métricas. Exige e-mail VERIFICADO —
    # pelo provedor externo ou pela confirmação do próprio app. Vazia por default: sem ela
    # ninguém administra nada, e a primeira identidade de administrador a entrar é quem adota
    # o progresso pré-existente (app_user id = 1). Ver docs/07-decisoes.md (D48).
    owner-emails: ${FOS_OWNER_EMAILS:}
    # As credenciais NÃO ficam declaradas aqui: provedor sem client-id e client-secret não é
    # registrado, não aparece na tela de login, e a aplicação sobe sem segredo nenhum. Para
    # habilitar, defina as variáveis documentadas no README:
    #   FOS_AUTH_PROVIDERS_GOOGLE_CLIENT_ID / _CLIENT_SECRET
    #   FOS_AUTH_PROVIDERS_FACEBOOK_CLIENT_ID / _CLIENT_SECRET
  email:
    # Confirmação de cadastro e redefinição de senha (D47). Sem estas duas a aplicação sobe
    # igual e o cadastro por senha responde indisponível — mesma regra dos provedores de login.
    # É a única credencial cuja ausência tira uma porta de entrada inteira: o cadastro É o
    # e-mail de confirmação.
    api-key: ${FOS_EMAIL_API_KEY:}
    from: ${FOS_EMAIL_FROM:}
  demo:
    # Conta-modelo do acesso demonstrativo (#62): o e-mail VERIFICADO da conta que o autor cura
    # pelo próprio app e que cada visita recebe copiada. Vazio por default — sem ela a aplicação
    # sobe igual, o botão não aparece na landing e o endpoint responde que não há demonstração
    # neste ambiente. Mesma regra dos provedores de login e do envio de e-mail.
    template-email: ${FOS_DEMO_TEMPLATE_EMAIL:}
  usage:
    # Coleta de uso do app (#84, D50): quantas pessoas chegam, de onde vêm e com o quê.
    # Nada aqui é segredo e nada precisa estar preenchido.
    #
    # Desligar para de gravar evento; o resto do app funciona igual. É a saída para quem sobe
    # este código e não quer coleta nenhuma.
    # Desligar para de gravar evento E faz o endpoint responder 503, que é como o navegador
    # descobre que não precisa mais mandar nada. Sem isso, um app com a coleta desligada seguiria
    # fazendo uma requisição por navegação para um servidor que as joga fora.
    enabled: ${FOS_USAGE_ENABLED:true}
    # Base de geolocalização LOCAL (DB-IP Lite, CC BY 4.0, ou equivalente): CSV de
    # `início,fim,país[,região]`, aceito também em .gz. Vazio por default — dev e CI sobem sem
    # base e coletam tudo menos país, que vira 'ZZ'. Nunca há chamada a serviço externo por
    # requisição: o IP de quem usa o app não vai para lugar nenhum (docs/11-privacidade.md).
    geoip-database: ${FOS_USAGE_GEOIP_DATABASE:}
    # Retenção da tabela CRUA, em dias. O agregado não expira — ele não tem chave de visita nem
    # id de conta. Mudar isto muda a promessa escrita em docs/11-privacidade.md.
    retention-days: ${FOS_USAGE_RETENTION_DAYS:90}
    # Teto de acessos gravados por dia. É o único limite da coleta que não depende de nada que o
    # cliente possa escolher: o freio por visita é chaveado no IP + User-Agent, e o User-Agent é
    # do cliente — variá-lo dá chave nova e contorna aquele, mesmo com o IP já consertado pela
    # #77. Folgado de propósito —
    # não é para moldar a métrica, é para a tabela parar de crescer se alguém apontar um laço para
    # o endpoint. Bateu no teto, sai aviso no log.
    # 5 000/dia x 90 dias de retenção ~ 123 MB no pior caso (273 bytes por linha, medidos, já
    # com os índices). O que se paga é a marca d'água e não a contagem de hoje: o expurgo apaga
    # as linhas, mas o Postgres só devolve o disco com VACUUM FULL.
    daily-cap: ${FOS_USAGE_DAILY_CAP:5000}
    # Quando o job de agregação e expurgo roda. Era constante no código, e por isso não havia como
    # adiantá-lo para conferir os dois numa máquina de desenvolvimento. `-` desliga o agendamento.
    # Lido por `@Scheduled` via placeholder (UsageMaintenanceJob), não pelo FosProperties.
    cron: ${FOS_USAGE_CRON:0 17 3 * * *}
  health:
    # Saúde do site (#86): o que a aplicação observa sobre si mesma, e quando ela avisa.
    #
    # Nada aqui é segredo. O que é segredo é a credencial de envio, e ela mora em fos.email.* —
    # sem ela a aplicação sobe igual e nenhum alerta é enviado, como manda a regra 4 do CLAUDE.md.
    # Estes números dizem QUANDO avisar, não SE há como avisar.
    #
    # Janela que o alerta observa, em minutos. Ela é lida da memória do processo (o que foi
    # gravado tem granularidade de hora), então mudá-la não mexe em nada que já esteja no banco.
    window-minutes: ${FOS_HEALTH_WINDOW_MINUTES:15}
    # Taxa de 5xx, em pontos percentuais, que caracteriza incidente. Alta o bastante para não
    # disparar com o erro isolado que todo app tem; baixa o bastante para uma rota quebrada por
    # deploy aparecer no mesmo quarto de hora.
    error-rate-percent: ${FOS_HEALTH_ERROR_RATE_PERCENT:10}
    # Piso de requisições na janela para a taxa querer dizer alguma coisa. Sem ele, uma única
    # requisição que falhasse às 4h da manhã seria "100% de erro".
    min-requests: ${FOS_HEALTH_MIN_REQUESTS:20}
    # Quantas respostas 401/403 na janela caracterizam pico. Conta separado do 5xx de propósito:
    # ali o app está errando, aqui ele está recusando certo — e o que isso denuncia é varredura
    # de credencial, não defeito.
    auth-rejects: ${FOS_HEALTH_AUTH_REJECTS:50}
    # Retenção das tabelas de estatística e de subidas. Nenhuma delas tem dado pessoal, então
    # aqui a retenção é economia de disco e não promessa de privacidade — ao contrário da
    # tabela crua de uso (D50).
    retention-days: ${FOS_HEALTH_RETENTION_DAYS:90}
    # Quando o buffer de medição é descarregado no banco e o incidente é verificado. `-` desliga
    # o agendamento — e desliga as duas coisas, porque quem não quer gravar não quer alerta.
    # Lido por @Scheduled via placeholder (SiteHealthJob), não pelo FosProperties.
    cron: ${FOS_HEALTH_CRON:0 */5 * * * *}
    # Quando o expurgo roda. Horário quebrado para não competir com o topo da hora nem com o job
    # da coleta de uso.
    purge-cron: ${FOS_HEALTH_PURGE_CRON:0 27 3 * * *}
  proxy:
    # Quantos endereços a requisição ganha na cadeia até chegar aqui (#77). É o que diz de qual
    # posição sai quem está navegando: cada salto anexa um endereço ao FIM da lista, então a
    # leitura conta de trás para frente. 1 é o Compose, onde só o nginx está na frente.
    #
    # Na Railway o valor é 3, e isso foi MEDIDO no log de acesso do nginx em produção, não
    # deduzido: a borda da plataforma DESCARTA o X-Forwarded-For de quem chama e entrega
    # `<visitante>, <nó de borda>`; o nginx anexa o próprio peer e o backend recebe três
    # elementos. Com 2 a chave seria o nó de borda — o mesmo para todo mundo que entra por ele.
    # Ver dev.fos.service.ClientIp e a D51.
    trusted-hops: ${FOS_PROXY_TRUSTED_HOPS:1}
  streak:
    # Freeze de streak (#99, D55): quantos dias perdidos o mês de calendário perdoa antes de a
    # corrente quebrar. Nada aqui é segredo, e o app sobe igual com ou sem a variável.
    #
    # 0 desliga o perdão e devolve o comportamento anterior à #99 — ao contrário dos outros
    # blocos, aqui zero é escolha e não "não configurado".
    freezes-per-month: ${FOS_STREAK_FREEZES_PER_MONTH:2}
  curriculum:
    index: 'classpath:curriculum/modules.json'
    # Reingerir o currículo na subida. Como a árvore é dado versionado (D11), a fonte
    # de verdade é o JSON — o banco é só projeção dele.
    sync-on-startup: true

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html

server:
  # PORT em vez de SERVER_PORT porque é o nome que a Railway injeta em runtime (ela ignora
  # o EXPOSE do Dockerfile). O default 8080 mantém `./mvnw spring-boot:run` como era.
  port: ${PORT:8080}
  # `::` na Railway: a rede privada resolve IPv6 e ambientes anteriores a 16/10/2025 são
  # IPv6-only — com 0.0.0.0 o backend fica invisível para o nginx lá. Local segue 0.0.0.0.
  address: ${SERVER_ADDRESS:0.0.0.0}
  # O redirect URI do OAuth é montado a partir da URL que o backend acha que recebeu. Atrás
  # do nginx (D23/D24) e do TLS da plataforma, sem honrar X-Forwarded-* ele montaria
  # `http://backend-interno/...` e o provedor recusaria por redirect_uri divergente. Só o
  # nginx fala com o backend, então confiar nesses headers aqui é seguro.
  forward-headers-strategy: framework
  servlet:
    session:
      cookie:
        http-only: true
        # Lax, e não Strict: o retorno do provedor é uma navegação de outro site para o app,
        # e com Strict o cookie de sessão não viajaria nela. Não é None de propósito — None
        # exigiria Secure sempre e abriria o cookie para requisição cross-site de qualquer um.
        same-site: lax

management:
  endpoints:
    web:
      exposure:
        # Só o health. É o que a Railway consulta em deploy.healthcheckPath e o que o
        # healthcheck do Compose usa; o resto do actuator não precisa estar no ar.
        include: health

---
spring:
  config:
    activate:
      on-profile: dev
  datasource:
    # H2 em modo PostgreSQL: dev sem exigir Docker. Para rodar contra Postgres de verdade,
    # `docker compose up -d db` e use o perfil `postgres`.
    url: jdbc:h2:mem:fos;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH
    driver-class-name: org.h2.Driver
    username: sa
    password: ''
---
spring:
  config:
    activate:
      on-profile: postgres
  datasource:
    url: ${FOS_DB_URL:jdbc:postgresql://localhost:5432/fos}
    username: ${FOS_DB_USER:fos}
    password: ${FOS_DB_PASSWORD:fos}
