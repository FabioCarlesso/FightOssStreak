spring:
  main:
    # Permite que o teste substitua o bean de Clock por um relógio fixo.
    allow-bean-definition-overriding: true
  datasource:
    url: jdbc:h2:mem:fos-test;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password: ''
  jpa:
    hibernate:
      ddl-auto: validate

fos:
  disclaimer-version: 'test-1'
  curriculum:
    sync-on-startup: true
