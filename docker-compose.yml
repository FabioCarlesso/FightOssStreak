services:
  db:
    image: postgres:16-alpine
    container_name: fos-db
    environment:
      POSTGRES_DB: fos
      POSTGRES_USER: fos
      POSTGRES_PASSWORD: fos
    ports:
      - "5432:5432"
    volumes:
      - fos-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fos -d fos"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  fos-pgdata:
