name: videos

# Verificação periódica dos vídeos já catalogados. Este job **não** é required check da ruleset
# de `main` (.github/rulesets/main.json), e não deve virar um: um vídeo que saiu do ar é problema
# de curadoria, não motivo para travar o merge de código. Por isso ele vive em workflow separado
# dos jobs `backend` e `web`, e não roda em pull_request.

on:
  workflow_dispatch:
  schedule:
    # Segunda-feira, 06:00 UTC (03:00 em São Paulo). Semanal basta: o ponto é não descobrir o
    # vídeo quebrado abrindo o nó depois do treino — não é uma emergência de minutos.
    - cron: '0 6 * * 1'

permissions:
  contents: read
  issues: write

concurrency:
  group: videos
  cancel-in-progress: false

jobs:
  videos:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      # Sem `npm ci`: o script não tem dependência, só a rede até o youtube.com.
      # 0 = tudo disponível, 1 = há vídeo quebrado, 2 = não deu para verificar.
      - name: Verificar disponibilidade dos vídeos
        id: verificacao
        run: |
          codigo=0
          # `|| codigo=$?` em vez de deixar o erro escapar: o shell do step aborta no primeiro
          # comando que falha, e aqui o código de saída é justamente o resultado que interessa.
          node scripts/verificar-videos.mjs > relatorio.txt 2>&1 || codigo=$?
          cat relatorio.txt
          echo "codigo=$codigo" >> "$GITHUB_OUTPUT"

      - name: Abrir ou atualizar a issue de aviso
        if: steps.verificacao.outputs.codigo == '1'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const relatorio = fs.readFileSync('relatorio.txt', 'utf8').trim();

            // Marcador invisível: é por ele que a execução seguinte reconhece a issue que já
            // existe, em vez de abrir uma nova a cada segunda-feira. O título pode ser editado
            // à mão sem quebrar isso.
            const MARCADOR = '<!-- fos:videos-indisponiveis -->';
            const TITULO = 'Vídeos catalogados fora do ar';
            const execucao = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;

            const corpo = [
              MARCADOR,
              'A verificação automática (`scripts/verificar-videos.mjs`) encontrou vídeos catalogados',
              'que não estão mais públicos ou tiveram a incorporação desativada.',
              '',
              'Substituir é curadoria humana: escolha o vídeo pelos critérios do nó em',
              '`docs/08-curadoria-videos.md` e recatalogue com `node scripts/catalogar-video.mjs <NÓ> <url>`.',
              '',
              '```text',
              relatorio,
              '```',
              '',
              `Última verificação: ${new Date().toISOString()} — [execução](${execucao})`,
            ].join('\n');

            const abertas = await github.paginate(github.rest.issues.listForRepo, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              per_page: 100,
            });
            const existente = abertas.find((issue) => (issue.body ?? '').includes(MARCADOR));

            if (!existente) {
              const { data } = await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title: TITULO,
                body: corpo,
              });
              core.notice(`Issue #${data.number} aberta com o relatório.`);
              return;
            }

            // O corpo é sempre reescrito, para que a issue mostre o estado de agora e não o da
            // primeira execução. O comentário só sai quando o relatório mudou de fato — comentar
            // toda semana com o mesmo conteúdo transformaria o aviso em ruído.
            const anterior = (existente.body ?? '').match(/```text\n([\s\S]*?)\n```/)?.[1]?.trim();
            await github.rest.issues.update({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: existente.number,
              body: corpo,
            });

            if (anterior !== relatorio) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: existente.number,
                body: `O relatório mudou desde a última verificação:\n\n\`\`\`text\n${relatorio}\n\`\`\`\n\n[execução](${execucao})`,
              });
            }
            core.notice(`Issue #${existente.number} atualizada.`);

      - name: Fechar a issue quando todos voltarem
        if: steps.verificacao.outputs.codigo == '0'
        uses: actions/github-script@v7
        with:
          script: |
            const MARCADOR = '<!-- fos:videos-indisponiveis -->';
            const abertas = await github.paginate(github.rest.issues.listForRepo, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              per_page: 100,
            });
            const existente = abertas.find((issue) => (issue.body ?? '').includes(MARCADOR));
            if (!existente) return;

            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: existente.number,
              body: 'Todos os vídeos catalogados voltaram a estar disponíveis e incorporáveis. Fechando.',
            });
            await github.rest.issues.update({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: existente.number,
              state: 'closed',
              state_reason: 'completed',
            });

      # Deixar a execução vermelha é o segundo canal de aviso, e o único que aparece quando a
      # falha foi ao *verificar* (código 2), caso em que não há o que reportar em issue.
      - name: Falhar a execução quando algo precisa de atenção
        if: steps.verificacao.outputs.codigo != '0'
        run: |
          echo "::error::verificar-videos.mjs terminou com código ${{ steps.verificacao.outputs.codigo }} — ver relatório acima"
          exit 1
