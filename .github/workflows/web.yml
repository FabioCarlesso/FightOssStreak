name: web

on:
  # Permite disparar pela aba Actions. Útil quando o push não gera evento — por exemplo,
  # quando o commit chega por um token de app que não aciona workflow.
  workflow_dispatch:
  # No push a main o filtro por caminho vale: nada depende desse resultado.
  push:
    branches: [main]
    paths:
      - 'web/**'
      - 'shared/**'
      - 'scripts/**'
      - 'package.json'
      - 'package-lock.json'
      - 'backend/openapi.json'
      - '.github/workflows/web.yml'
      # Documentação também: a guarda de links abaixo é o que pega um arquivo de docs/ renomeado.
      - '**/*.md'
  # Em PR NÃO há filtro por caminho, de propósito. Este job é required check da ruleset
  # de `main`: workflow filtrado por path simplesmente não reporta status, e um required
  # check que nunca reporta trava o PR em "waiting for status" para sempre.
  pull_request:

# Corrigir um typo e empurrar de novo deixava dois runs completos disputando o runner. A
# mergeabilidade do PR é avaliada no commit mais recente, então um run cancelado por supersessão
# não trava merge. Vale também para push em `main`, onde nada depende do resultado.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # O nome do job é o contexto usado pela ruleset (.github/rulesets/main.json).
  # Renomear aqui exige renomear lá.
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # Primeiro passo do job, antes de qualquer instalação: falha em segundos e não custa nada.
      # Renomear um job de CI derruba a proteção de `main` em silêncio, porque o contexto do
      # required check é o nome do job. Só o Node do runner é usado — nada de `npm ci` aqui.
      - name: Ruleset e jobs de CI batem
        run: node scripts/verificar-ruleset.mjs

      # Mesma lógica: só Node e git, falha em segundos. Arquivo de docs/ renomeado ou título de
      # seção alterado deixa para trás link e comentário de código apontando para o nada (#135).
      - name: Links da documentação resolvem
        run: node scripts/verificar-links-docs.mjs

      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm

      - run: npm ci

      # Depois do `npm ci` porque as próprias regras vêm de dependências, e antes dos testes
      # porque falha em segundos. `npm run lint:fix` corrige localmente o que for corrigível.
      - name: Lint e formatação
        run: npm run lint

      # Três camadas: as regras puras de shared/domain (streak, SM-2 e desbloqueio — cujos casos
      # de SRS são espelhados no backend, então divergir entre as duas implementações quebra aqui
      # ou lá), os scripts de curadoria, e os fluxos de UI que decidem se o produto é usável:
      # aceite do disclaimer, quiz e drill.
      - name: Testes
        run: npm test

      # shared/types é GERADO. Se o resultado divergir do que está commitado, o front está
      # compilando contra um contrato que o backend não serve mais.
      - name: shared/types está em dia com o OpenAPI
        run: |
          npm run gen:types
          git diff --exit-code -- shared/types/generated \
            || { echo "::error::shared/types desatualizado — rode 'npm run gen:types' e commite"; exit 1; }

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build --workspace @fos/web

      # O build acima roda direto no runner; a imagem é outro ambiente, e é ela que a Railway
      # usa (D22). Este build é especialmente frágil por motivo estrutural: o contexto precisa ser
      # a raiz do monorepo, porque os workspaces @fos/* exportam TypeScript de src/ sem dist/.
      # Mudança em package.json, em package-lock.json ou na estrutura de shared/ quebra a imagem
      # sem quebrar teste nenhum.
      - uses: docker/setup-buildx-action@v4

      - name: Imagem do web builda
        uses: docker/build-push-action@v7
        with:
          # Contexto é a RAIZ, não web/. `docker build web/` passa a impressão de funcionar até
          # falhar na resolução dos imports dos workspaces.
          context: .
          file: web/Dockerfile
          push: false
          # Carregada no daemon do runner para o passo seguinte subir um container dela.
          load: true
          tags: fos-web:ci
          cache-from: type=gha,scope=web
          cache-to: type=gha,mode=max,scope=web,ignore-error=true

      # O nginx.conf.template só é exercitado com o container de pé, e o defeito que ele mais
      # facilmente ganha é silencioso: um `add_header` num `location` apaga ali todos os cabeçalhos
      # de segurança do `server` (#75). Sem backend de propósito — ver o cabeçalho do script.
      - name: Cabeçalhos de segurança do nginx
        run: |
          docker run -d --name fos-web-ci -p 8090:80 fos-web:ci
          for i in $(seq 1 20); do curl -sf -o /dev/null http://localhost:8090/healthz && break; sleep 1; done
          node scripts/verificar-cabecalhos.mjs http://localhost:8090 || { docker logs fos-web-ci; exit 1; }
