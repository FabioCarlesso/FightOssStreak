<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <!-- O `--bg` de cada tema (shared/tokens, D74): a barra do navegador acompanha o sistema. -->
    <meta name="theme-color" content="#0f1115" media="(prefers-color-scheme: dark)" />
    <meta name="theme-color" content="#f5f6f8" media="(prefers-color-scheme: light)" />
    <!-- O app tem tema escuro e claro próprios (D74): extensão de modo escuro (Dark Reader) não
         repinta por cima, senão as cores dos tokens saem misturadas com as dela. -->
    <meta name="darkreader-lock" />
    <!-- Síncrono e antes do CSS: aplica o tema escolhido na tela Conta sem piscar (D74). -->
    <script src="/tema.js"></script>
    <title>FightOssStreak</title>
    <meta
      name="description"
      content="Ferramenta de revisão e retenção do que é aprendido no tatame. Não ensina jiu-jitsu e não substitui instrução presencial."
    />

    <!-- As tags absolutas (url e imagem) são injetadas no build — ver vite.config.ts. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="FightOssStreak" />
    <meta property="og:locale" content="pt_BR" />
    <meta property="og:title" content="FightOssStreak — revise o que você viu no tatame" />
    <meta
      property="og:description"
      content="Na segunda você aprendeu três técnicas. Na sexta, lembra de uma. Currículo em árvore, quiz conceitual e repetição espaçada para reter o que a aula ensinou."
    />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="FightOssStreak — revise o que você viu no tatame" />
    <meta
      name="twitter:description"
      content="Na segunda você aprendeu três técnicas. Na sexta, lembra de uma. Currículo em árvore, quiz conceitual e repetição espaçada para reter o que a aula ensinou."
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
